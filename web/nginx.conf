server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Resolución en cada petición: nginx arranca aunque el backend aún no exista o se reinicie.
    resolver 127.0.0.11 valid=10s;
    set $backend http://backend:8080;

    # El túnel entrega la petición ya con HTTPS terminado; el backend necesita saberlo.
    location ~ ^/(api|auth)/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_read_timeout 60s;
    }

    location /healthz {
        proxy_pass $backend;
    }

    # Los ficheros de /assets llevan hash en el nombre: se pueden cachear sin límite.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier ruta desconocida la resuelve el router del cliente.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
